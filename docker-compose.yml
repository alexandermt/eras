version: "3.9"

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${MARIADB_DB:-eras}
      MARIADB_USER: ${MARIADB_USER:-eras}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-eras_password}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MARIADB_HOST: db
      MARIADB_PORT: 3306
      MARIADB_USER: ${MARIADB_USER:-eras}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-eras_password}
      MARIADB_DB: ${MARIADB_DB:-eras}
      ORACLE_DSN: ${ORACLE_DSN:-oracle-host:1521/ORCL}
      ORACLE_USER: ${ORACLE_USER:-eras_readonly}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-changeme}
      LDAP_SERVER: ${LDAP_SERVER:-ldap://ldap-host:389}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=example,dc=com}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-cn=eras-svc,dc=example,dc=com}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-changeme}
      LDAP_USER_SEARCH_BASE: ${LDAP_USER_SEARCH_BASE:-ou=users,dc=example,dc=com}
      LDAP_SELECTOR_GROUP: ${LDAP_SELECTOR_GROUP:-cn=eras-selectors,ou=groups,dc=example,dc=com}
      LDAP_ADMIN_GROUP: ${LDAP_ADMIN_GROUP:-cn=eras-admins,ou=groups,dc=example,dc=com}
      SECRET_KEY: ${SECRET_KEY:-changeme-use-a-strong-random-key}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:80"]'
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mariadb_data:
